# Autobuild a Docker container and push to Docker Hub
# - Pushes to `main` branch will go to `latest` Docker tag.
# - Pushes to `*.*` GitHub Release tags will go to a versioned Docker tag.
name: Simple Docker Build
on:
  push:
    branches:
      - main
    tags:
      - "*.*"
env:
  DOCKER_AUTOBUILDS_CONTEXT_PATH: .
  DOCKER_AUTOBUILDS_DOCKERFILE_PATH: Dockerfile
  DOCKER_REPOSITORY_NAME: niemasd/bcftools # set to Docker Hub repository
jobs:
  autobuilds:
    runs-on: ubuntu-latest
    steps:
      - name: Set up paths
        id: paths
        run: |
          echo "build_path=./${{ env.DOCKER_AUTOBUILDS_CONTEXT_PATH }}" >> $GITHUB_OUTPUT
          echo "dockerfile_path=${{ env.DOCKER_AUTOBUILDS_DOCKERFILE_PATH }}" >> $GITHUB_OUTPUT
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
      - name: Generate Docker image tags
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.DOCKER_REPOSITORY_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
            type=semver,pattern={{version}}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Log in to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      - name: Build and tag Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ steps.paths.outputs.build_path }}
          file: ${{ steps.paths.outputs.dockerfile_path }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
